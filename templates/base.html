{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="en" data-theme="{{ user_theme }}" data-is-dark="{{ is_dark }}">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Meine App{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token }}">

    <!-- Scripts -->
    <script src="{% static 'js/main.js' %}"></script>

    <!-- Favicon, Fonts, Styles -->
    <link rel="stylesheet" href="{% static 'css/main/themes.css' %}">
    <link rel="stylesheet" href="{% static 'css/main/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/main/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/main/footer.css' %}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    {% include "components/navbar.html" %}

    <main>
        {% block content %}
        <!-- Seiteninhalt -->
        {% endblock %}
    </main>

    {% include "components/footer.html" %}

    {% block scripts %}{% endblock %}
</body>
</html>
